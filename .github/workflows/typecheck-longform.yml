name: Long-form engine typecheck

on:
  push:
    branches:
      - "build/longform-engine-v1"
    paths:
      - "studio/**"
      - ".github/workflows/typecheck-longform.yml"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
