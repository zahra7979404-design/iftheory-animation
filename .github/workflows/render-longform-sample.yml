name: Render long-form sample

on:
  push:
    branches:
      - "build/longform-engine-v1"
    paths:
      - "studio/**"
      - ".github/workflows/render-longform-sample.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - name: Render 60-second sample
        run: npx remotion render src/index.ts LongformSample out/longform-sample.mp4 --codec=h264 --crf=20
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: longform-sample-mp4
          path: studio/out/longform-sample.mp4
          if-no-files-found: error
          retention-days: 7
