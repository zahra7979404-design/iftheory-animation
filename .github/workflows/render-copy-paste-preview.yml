name: Render CopyPaste reference preview

on:
  push:
    branches:
      - "render/copy-paste-preview"
    paths:
      - ".github/workflows/render-copy-paste-preview.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - name: Render CopyPaste reference episode
        run: npx remotion render src/index.ts CopyPaste out/copy-paste-preview.mp4 --codec=h264 --crf=20
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: copy-paste-preview-mp4
          path: studio/out/copy-paste-preview.mp4
          if-no-files-found: error
          retention-days: 7
